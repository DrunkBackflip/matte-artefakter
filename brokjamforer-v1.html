<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Brøkjamfører — B3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800;900&display=swap" />
<style>
  :root {
    --bg: #f4ecdc;
    --paper: #faf4e6;
    --ink: #181410;
    --ink-2: rgba(24, 20, 16, 0.62);
    --ink-3: rgba(24, 20, 16, 0.42);
    --rule: rgba(24, 20, 16, 0.14);
    --coral: #e64a3b;
    --coral-soft: #fad9d3;
    --steel: #355c7d;
    --steel-soft: #d2dde6;
    --ok: #36713e;
    --ok-soft: #dde8d2;
    --warn: #b1382d;
    --warn-soft: #f3d4cf;
    --neutral: #a89066;
    --border-w: 2px;
    --shadow-lg: 7px 7px 0 var(--ink);
    --shadow-md: 4px 4px 0 var(--ink);
    --shadow-cta: 4px 4px 0 var(--coral);
    --radius-card: 18px;
    --radius-pill: 999px;
    --font-head: 'Nunito', system-ui, sans-serif;
    --font-body: 'Nunito', system-ui, sans-serif;
  }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--bg);
    background-image: radial-gradient(circle at 1px 1px, rgba(24,20,16,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    font-size: 15px;
    line-height: 1.55;
  }
  .vb3 { padding: 36px; box-sizing: border-box; min-height: 100%; }
  .vb3 * { box-sizing: border-box; }
  .vb3-wrap { max-width: 1080px; margin: 0 auto; background: var(--paper); border: var(--border-w) solid var(--ink); border-radius: 28px; padding: 40px 44px 36px; box-shadow: var(--shadow-lg); }

  /* Header */
  .vb3-head { margin-bottom: 40px; padding-bottom: 32px; border-bottom: var(--border-w) solid var(--ink); }
  .vb3-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; gap: 16px; flex-wrap: wrap; }
  .vb3-mark { display: flex; align-items: center; gap: 4px; font-family: var(--font-head); font-weight: 800; font-size: 16px; }
  .vb3-mark-dot { width: 14px; height: 14px; border-radius: 50%; border: var(--border-w) solid var(--ink); }
  .vb3-mark-dot.coral { background: var(--coral); }
  .vb3-mark-dot.steel { background: var(--steel); margin-left: -8px; }
  .vb3-mark span { margin-left: 8px; }
  .vb3-levels { display: flex; gap: 4px; background: var(--bg); padding: 4px; border-radius: var(--radius-pill); border: var(--border-w) solid var(--ink); }
  .vb3-lvl { font: inherit; font-family: var(--font-head); cursor: pointer; background: transparent; border: 0; padding: 7px 14px; border-radius: var(--radius-pill); display: flex; flex-direction: column; min-height: 44px; color: var(--ink); align-items: flex-start; white-space: nowrap; }
  .vb3-lvl:hover { background: var(--paper); }
  .vb3-lvl.on { background: var(--ink); color: var(--paper); }
  .vb3-lvl-num { font-weight: 800; font-size: 11px; letter-spacing: 0.08em; opacity: 0.7; }
  .vb3-lvl-name { font-size: 13px; font-weight: 700; }
  .vb3-title { font-family: var(--font-head); font-size: 44px; font-weight: 900; letter-spacing: -0.02em; margin: 0 0 32px; line-height: 1.05; max-width: 760px; }

  /* Big fraction cards */
  .vb3-fracs { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .vb3-fracbig { display: flex; align-items: center; gap: 18px; background: var(--paper); border: var(--border-w) solid var(--ink); border-radius: var(--radius-card); padding: 18px 28px; flex: 1; min-width: 220px; box-shadow: var(--shadow-md); }
  .vb3-fracbig.coral { background: var(--coral-soft); }
  .vb3-fracbig.steel { background: var(--steel-soft); }
  .vb3-fracbig-letter { width: 56px; height: 56px; border-radius: 50%; border: var(--border-w) solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 900; font-size: 26px; }
  .coral .vb3-fracbig-letter { background: var(--coral); color: var(--paper); }
  .steel .vb3-fracbig-letter { background: var(--steel); color: var(--paper); }
  .vb3-fracbig-stack { text-align: center; font-family: var(--font-head); }
  .vb3-fracbig-n, .vb3-fracbig-d { font-size: 36px; line-height: 1.05; font-weight: 900; }
  .vb3-fracbig-bar { height: 3px; background: var(--ink); margin: 4px auto; width: 44px; border-radius: 2px; }
  .vb3-vs { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: var(--paper); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; letter-spacing: 0.05em; flex-shrink: 0; }

  /* Block */
  .vb3-block { padding: 36px 0; border-bottom: var(--border-w) solid var(--ink); }
  .vb3-block:last-of-type { border-bottom: 0; padding-bottom: 12px; }
  .vb3-block-head { display: flex; gap: 18px; align-items: flex-start; margin-bottom: 24px; }
  .vb3-block-num { font-family: var(--font-head); font-weight: 900; font-size: 32px; line-height: 1; background: var(--ink); color: var(--paper); padding: 6px 12px; border-radius: 8px; letter-spacing: -0.02em; flex-shrink: 0; }
  .vb3-block-text h2 { font-family: var(--font-head); margin: 0 0 4px; font-size: 24px; font-weight: 900; letter-spacing: -0.005em; }
  .vb3-block-text p { margin: 0; color: var(--ink-2); font-size: 15px; }

  /* Circles */
  .vb3-circles { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 720px) { .vb3-circles { grid-template-columns: 1fr; } }
  .vb3-circle { background: var(--paper); border: var(--border-w) solid var(--ink); border-radius: var(--radius-card); padding: 22px; display: flex; flex-direction: column; gap: 16px; box-shadow: var(--shadow-md); }
  .vb3-circle.coral { background: var(--coral-soft); }
  .vb3-circle.steel { background: var(--steel-soft); }
  .vb3-circle-head { display: flex; justify-content: space-between; align-items: baseline; }
  .vb3-circle-letter { width: 36px; height: 36px; border-radius: 50%; border: var(--border-w) solid var(--ink); display: flex; align-items: center; justify-content: center; font-family: var(--font-head); font-weight: 900; font-size: 16px; }
  .vb3-circle.coral .vb3-circle-letter { background: var(--coral); color: var(--paper); }
  .vb3-circle.steel .vb3-circle-letter { background: var(--steel); color: var(--paper); }
  .vb3-circle-readout { font-family: var(--font-head); font-weight: 900; font-size: 26px; letter-spacing: -0.01em; }
  .vb3-circle-slash { color: var(--ink-3); margin: 0 1px; }
  .vb3-circle-svg { width: 220px; height: 220px; align-self: center; }
  .vb3-slice { fill: var(--paper); stroke: var(--ink); stroke-width: var(--border-w); cursor: pointer; transition: fill 0.15s ease; }
  .vb3-circle.coral .vb3-slice.on { fill: var(--coral); }
  .vb3-circle.steel .vb3-slice.on { fill: var(--steel); }
  .vb3-slice:hover:not(.on) { fill: var(--bg); }
  .vb3-circle-ring { fill: none; stroke: var(--ink); stroke-width: 2.4; pointer-events: none; }
  .vb3-circle-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .vb3-ctrl-label { font-size: 11px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); margin-right: 4px; }
  .vb3-pm { width: 44px; height: 44px; border-radius: 50%; border: var(--border-w) solid var(--ink); background: var(--paper); font-size: 22px; font-weight: 900; cursor: pointer; color: var(--ink); }
  .vb3-pm:hover { background: var(--ink); color: var(--paper); }
  .vb3-ctrl-val { font-family: var(--font-head); font-size: 24px; font-weight: 900; min-width: 28px; text-align: center; }

  /* Buttons */
  .vb3-btn { font: inherit; font-family: var(--font-head); cursor: pointer; font-weight: 800; border-radius: var(--radius-pill); padding: 0 22px; height: 44px; font-size: 14px; border: var(--border-w) solid var(--ink); background: var(--paper); color: var(--ink); }
  .vb3-btn-soft { margin-left: auto; }
  .vb3-btn-soft:hover { background: var(--ink); color: var(--paper); }
  .vb3-btn-primary { background: var(--ink); color: var(--paper); margin-top: 20px; height: 50px; padding: 0 26px; font-size: 15px; box-shadow: var(--shadow-cta); }
  .vb3-btn-primary:hover { background: var(--coral); box-shadow: var(--shadow-md); }

  /* Feedback */
  .vb3-fb { display: flex; gap: 12px; margin-top: 4px; padding: 12px 16px; border-radius: 12px; background: var(--paper); border: var(--border-w) solid var(--ink); max-width: 640px; align-items: stretch; }
  .vb3-fb-bar { width: 4px; border-radius: 2px; flex-shrink: 0; }
  .vb3-fb-text { font-size: 15px; font-weight: 700; line-height: 1.4; }
  .vb3-fb-ok { background: var(--ok-soft); }
  .vb3-fb-ok .vb3-fb-bar { background: var(--ok); } .vb3-fb-ok .vb3-fb-text { color: var(--ok); }
  .vb3-fb-equiv { background: var(--coral-soft); }
  .vb3-fb-equiv .vb3-fb-bar { background: var(--coral); } .vb3-fb-equiv .vb3-fb-text { color: var(--coral); }
  .vb3-fb-no { background: var(--warn-soft); }
  .vb3-fb-no .vb3-fb-bar { background: var(--warn); } .vb3-fb-no .vb3-fb-text { color: var(--warn); }
  .vb3-fb-empty .vb3-fb-bar { background: var(--ink-3); } .vb3-fb-empty .vb3-fb-text { color: var(--ink-2); }

  /* Number line */
  .vb3-nl { padding: 8px 0; }
  .vb3-nl-track { position: relative; height: 4px; background: var(--ink); margin: 80px 32px 28px; border-radius: 2px; }
  .vb3-nl-tick { position: absolute; top: -5px; width: 2px; height: 14px; background: var(--ink); transform: translateX(-1px); opacity: 0.4; border-radius: 1px; }
  .vb3-nl-half { position: absolute; top: 0; transform: translateX(-50%); }
  .vb3-nl-half-tick { width: 4px; height: 24px; background: var(--ink); margin: -10px auto 0; border-radius: 2px; }
  .vb3-nl-half-label { font-family: var(--font-head); font-weight: 900; font-size: 16px; position: absolute; top: 18px; left: 50%; transform: translateX(-50%); }
  .vb3-nl-end { position: absolute; font-family: var(--font-head); font-weight: 900; font-size: 18px; top: 14px; }
  .vb3-nl-end-l { left: -4px; transform: translateX(-50%); }
  .vb3-nl-end-r { right: -4px; transform: translateX(50%); }
  .vb3-nl-dot { position: absolute; top: 2px; transform: translate(-50%, -100%); cursor: grab; touch-action: none; display: flex; flex-direction: column; align-items: center; min-width: 44px; transition: left 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
  .vb3-nl-dot:active { cursor: grabbing; }
  .vb3-nl-dot:not(.snapped) { transition: none; }
  .vb3-nl-bubble { background: var(--paper); border: var(--border-w) solid var(--ink); border-radius: 12px; padding: 6px 14px; display: flex; align-items: center; gap: 6px; font-family: var(--font-head); font-weight: 900; font-size: 16px; box-shadow: var(--shadow-md); margin-bottom: 6px; }
  .vb3-nl-dot.coral .vb3-nl-bubble { background: var(--coral); color: var(--paper); }
  .vb3-nl-dot.steel .vb3-nl-bubble { background: var(--steel); color: var(--paper); }
  .vb3-nl-bubble-frac { font-size: 13px; opacity: 0.9; }
  .vb3-nl-stalk { width: 2px; height: 22px; background: var(--ink); }
  .vb3-nl-pin { width: 16px; height: 16px; border-radius: 50%; margin-top: -2px; border: var(--border-w) solid var(--ink); }
  .vb3-nl-dot.coral .vb3-nl-pin { background: var(--coral); }
  .vb3-nl-dot.steel .vb3-nl-pin { background: var(--steel); }
  .vb3-nl-row { display: flex; align-items: center; gap: 18px; margin-top: 24px; flex-wrap: wrap; }
  .vb3-nl-row .vb3-btn-soft { margin-left: 0; }
  .vb3-nl-fb { font-size: 16px; color: var(--ink); font-weight: 700; }

  /* Choices */
  .vb3-choices { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  @media (max-width: 720px) { .vb3-choices { grid-template-columns: 1fr; } }
  .vb3-choice { background: var(--paper); border: var(--border-w) solid var(--ink); border-radius: var(--radius-card); padding: 20px 18px; cursor: pointer; font: inherit; font-family: var(--font-head); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-height: 110px; box-shadow: var(--shadow-md); transition: transform 0.12s ease, box-shadow 0.12s ease; }
  .vb3-choice:hover { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 var(--ink); }
  .vb3-choice:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
  .vb3-choice.coral.sel { background: var(--coral); color: var(--paper); }
  .vb3-choice.steel.sel { background: var(--steel); color: var(--paper); }
  .vb3-choice.neutral.sel { background: var(--ink); color: var(--paper); }
  .vb3-choice:disabled { cursor: default; opacity: 0.7; }
  .vb3-choice-big { font-size: 28px; font-weight: 900; }
  .vb3-choice-sub { font-size: 13px; font-weight: 700; opacity: 0.8; }

  /* Footer */
  .vb3-foot { margin-top: 32px; padding-top: 20px; border-top: var(--border-w) solid var(--ink); display: flex; justify-content: space-between; font-size: 13px; color: var(--ink-2); flex-wrap: wrap; gap: 10px; font-weight: 700; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
// ── Brøk-logikk ─────────────────────────────────────────────────────────────

const LEVELS = [
  {
    id: 1, name: "Samme nevner",
    pairs: [
      { A: [2, 5], B: [3, 5] },
      { A: [4, 7], B: [2, 7] },
      { A: [3, 8], B: [5, 8] },
      { A: [5, 6], B: [1, 6] },
    ],
  },
  {
    id: 2, name: "Samme teller",
    pairs: [
      { A: [3, 4], B: [3, 8] },
      { A: [2, 5], B: [2, 3] },
      { A: [4, 7], B: [4, 5] },
      { A: [1, 6], B: [1, 4] },
    ],
  },
  {
    id: 3, name: "Begge ulike",
    pairs: [
      { A: [2, 3], B: [3, 5] },
      { A: [3, 4], B: [5, 8] },
      { A: [1, 2], B: [2, 4] },
      { A: [4, 6], B: [3, 4] },
      { A: [5, 8], B: [2, 3] },
    ],
  },
];

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }
function fracEq(a, b) { return a[0] * b[1] === a[1] * b[0]; }
function fracVal([n, d]) { return n / d; }

function piePaths(d, r, cx, cy) {
  if (d === 1) {
    return [{ idx: 0, path: `M ${cx} ${cy - r} A ${r} ${r} 0 1 1 ${cx - 0.001} ${cy - r} Z` }];
  }
  const out = [];
  for (let i = 0; i < d; i++) {
    const a0 = (i / d) * Math.PI * 2 - Math.PI / 2;
    const a1 = ((i + 1) / d) * Math.PI * 2 - Math.PI / 2;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
    const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    const large = (a1 - a0) > Math.PI ? 1 : 0;
    out.push({
      idx: i,
      path: `M ${cx} ${cy} L ${x0} ${y0} A ${r} ${r} 0 ${large} 1 ${x1} ${y1} Z`,
    });
  }
  return out;
}

function useFractionApp(storageId) {
  const KEY = "fraction-app-" + storageId;
  const initial = (() => {
    try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; }
  })();

  const [level, setLevel] = React.useState(initial.level ?? 3);
  const [pairIdx, setPairIdx] = React.useState(initial.pairIdx ?? 0);
  const levelObj = LEVELS.find(l => l.id === level) || LEVELS[0];
  const pair = levelObj.pairs[pairIdx % levelObj.pairs.length];
  const A = pair.A, B = pair.B;

  const [buildA, setBuildA] = React.useState({ d: A[1], sel: new Set() });
  const [buildB, setBuildB] = React.useState({ d: B[1], sel: new Set() });
  const [feedbackA, setFeedbackA] = React.useState(null);
  const [feedbackB, setFeedbackB] = React.useState(null);

  const [posA, setPosA] = React.useState(0.3);
  const [posB, setPosB] = React.useState(0.7);
  const [snapped, setSnapped] = React.useState(false);
  const [lineFeedback, setLineFeedback] = React.useState(null);

  const [answer, setAnswer] = React.useState(null);
  const [answerFeedback, setAnswerFeedback] = React.useState(null);

  // Persist
  React.useEffect(() => {
    try { localStorage.setItem(KEY, JSON.stringify({ level, pairIdx })); } catch (e) {}
  }, [level, pairIdx]);

  function resetForPair() {
    setBuildA({ d: A[1], sel: new Set() });
    setBuildB({ d: B[1], sel: new Set() });
    setFeedbackA(null); setFeedbackB(null);
    setPosA(0.3); setPosB(0.7); setSnapped(false); setLineFeedback(null);
    setAnswer(null); setAnswerFeedback(null);
  }

  // Reset when pair/level changes
  React.useEffect(resetForPair, [level, pairIdx]);

  function setLevelAndReset(id) { setLevel(id); setPairIdx(0); }
  function nextPair() { setPairIdx((pairIdx + 1) % levelObj.pairs.length); }

  function checkBuild(which) {
    const target = which === "A" ? A : B;
    const build = which === "A" ? buildA : buildB;
    const setFb = which === "A" ? setFeedbackA : setFeedbackB;
    if (build.sel.size === 0) {
      setFb({ kind: "empty", text: "Klikk på stykker for å fargelegge dem først." });
      return;
    }
    const same = build.d === target[1] && build.sel.size === target[0];
    const equiv = !same && fracEq([build.sel.size, build.d], target);
    if (same) setFb({ kind: "ok", text: `Riktig — ${target[0]}/${target[1]}.` });
    else if (equiv) setFb({ kind: "equiv", text: `${build.sel.size}/${build.d} er likeverdig med ${target[0]}/${target[1]} — også riktig!` });
    else setFb({ kind: "no", text: `Du har ${build.sel.size}/${build.d}. Mål: ${target[0]}/${target[1]}.` });
  }

  function checkLine() {
    const ta = fracVal(A), tb = fracVal(B);
    const da = Math.abs(posA - ta), db = Math.abs(posB - tb);
    if (da < 0.06 && db < 0.06) {
      setPosA(ta); setPosB(tb); setSnapped(true);
      setLineFeedback("Snap! Begge er på rett sted.");
    } else {
      setSnapped(false);
      setLineFeedback(da < 0.06 ? "B er ikke helt på plass ennå." : db < 0.06 ? "A er ikke helt på plass ennå." : "Begge må litt nærmere riktig sted.");
    }
  }

  function submitAnswer(id) {
    setAnswer(id);
    const va = fracVal(A), vb = fracVal(B);
    const correct = va > vb ? "A" : va < vb ? "B" : "eq";
    if (id === correct) {
      const text = correct === "eq"
        ? `Riktig — ${A[0]}/${A[1]} og ${B[0]}/${B[1]} er like store.`
        : correct === "A"
          ? `Riktig — ${A[0]}/${A[1]} er størst.`
          : `Riktig — ${B[0]}/${B[1]} er størst.`;
      setAnswerFeedback({ kind: "ok", text });
    } else {
      setAnswerFeedback({ kind: "no", text: "Ikke helt. Se på sirklene og tallinjen — sammenlign nøye." });
    }
  }

  return {
    level, setLevelAndReset, A, B, nextPair,
    buildA, setBuildA, buildB, setBuildB, feedbackA, feedbackB, checkBuild,
    posA, setPosA, posB, setPosB, snapped, lineFeedback, checkLine,
    answer, answerFeedback, submitAnswer,
  };
}

// ── Sub-komponenter ─────────────────────────────────────────────────────────

function Block({ num, title, sub, children }) {
  return (
    <section className="vb3-block">
      <div className="vb3-block-head">
        <div className="vb3-block-num">{num}</div>
        <div className="vb3-block-text">
          <h2>{title}</h2>
          <p>{sub}</p>
        </div>
      </div>
      {children}
    </section>
  );
}

function FracBig({ letter, n, d, kind }) {
  return (
    <div className={"vb3-fracbig " + kind}>
      <div className="vb3-fracbig-letter">{letter}</div>
      <div className="vb3-fracbig-stack">
        <div className="vb3-fracbig-n">{n}</div>
        <div className="vb3-fracbig-bar" />
        <div className="vb3-fracbig-d">{d}</div>
      </div>
    </div>
  );
}

function CircleBuilder({ label, kind, build, setBuild, feedback, onCheck }) {
  const { d, sel } = build;
  const paths = piePaths(d, 88, 100, 100);
  const setD = (nd) => setBuild({ d: nd, sel: new Set() });
  const toggle = (i) => {
    const ns = new Set(sel);
    if (ns.has(i)) ns.delete(i); else ns.add(i);
    setBuild({ d, sel: ns });
  };
  return (
    <div className={"vb3-circle " + kind}>
      <div className="vb3-circle-head">
        <span className="vb3-circle-letter">{label}</span>
        <span className="vb3-circle-readout">{sel.size}<span className="vb3-circle-slash">/</span>{d}</span>
      </div>
      <svg viewBox="0 0 200 200" className="vb3-circle-svg">
        {paths.map(p => (
          <path key={p.idx} d={p.path} className={"vb3-slice" + (sel.has(p.idx) ? " on" : "")} onClick={() => toggle(p.idx)} />
        ))}
        <circle cx="100" cy="100" r="88" className="vb3-circle-ring" />
      </svg>
      <div className="vb3-circle-controls">
        <span className="vb3-ctrl-label">Stykker</span>
        <button className="vb3-pm" onClick={() => setD(Math.max(2, d - 1))} aria-label="Færre stykker">−</button>
        <span className="vb3-ctrl-val">{d}</span>
        <button className="vb3-pm" onClick={() => setD(Math.min(12, d + 1))} aria-label="Flere stykker">+</button>
        <button className="vb3-btn vb3-btn-soft" onClick={onCheck}>Sjekk</button>
      </div>
      {feedback && (
        <div className={"vb3-fb vb3-fb-" + feedback.kind}>
          <div className="vb3-fb-bar" />
          <div className="vb3-fb-text">{feedback.text}</div>
        </div>
      )}
    </div>
  );
}

function NumberLine({ A, B, posA, posB, setPosA, setPosB, snapped, onCheck, feedback }) {
  const wrap = React.useRef(null);
  const dragging = React.useRef(null);
  const onPointerDown = (which) => (e) => {
    e.preventDefault();
    dragging.current = which;
    e.target.setPointerCapture && e.target.setPointerCapture(e.pointerId);
  };
  const onPointerMove = (e) => {
    if (!dragging.current || !wrap.current) return;
    const r = wrap.current.getBoundingClientRect();
    const t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    if (dragging.current === "A") setPosA(t); else setPosB(t);
  };
  const onPointerUp = () => { dragging.current = null; };
  const tickBase = Math.max(A[1], B[1]);
  const ticks = []; for (let i = 0; i <= tickBase; i++) ticks.push(i / tickBase);
  return (
    <div className="vb3-nl" ref={wrap} onPointerMove={onPointerMove} onPointerUp={onPointerUp} onPointerLeave={onPointerUp}>
      <div className="vb3-nl-track">
        {ticks.map((t, i) => <div key={i} className="vb3-nl-tick" style={{ left: (t * 100) + "%" }} />)}
        <div className="vb3-nl-half" style={{ left: "50%" }}>
          <div className="vb3-nl-half-tick" />
          <div className="vb3-nl-half-label">½</div>
        </div>
        <div className="vb3-nl-end vb3-nl-end-l">0</div>
        <div className="vb3-nl-end vb3-nl-end-r">1</div>
        <Dot letter="A" pos={posA} snapped={snapped} onPointerDown={onPointerDown("A")} frac={A} kind="coral" />
        <Dot letter="B" pos={posB} snapped={snapped} onPointerDown={onPointerDown("B")} frac={B} kind="steel" />
      </div>
      <div className="vb3-nl-row">
        <button className="vb3-btn vb3-btn-soft" onClick={onCheck}>Sjekk plassering</button>
        {feedback && <div className="vb3-nl-fb">{feedback}</div>}
      </div>
    </div>
  );
}

function Dot({ letter, pos, snapped, onPointerDown, frac, kind }) {
  return (
    <div className={"vb3-nl-dot " + kind + (snapped ? " snapped" : "")} style={{ left: (pos * 100) + "%" }} onPointerDown={onPointerDown} role="slider" aria-label={`Plassering for ${letter}`}>
      <div className="vb3-nl-bubble">
        <span>{letter}</span>
        {snapped && <span className="vb3-nl-bubble-frac">{frac[0]}/{frac[1]}</span>}
      </div>
      <div className="vb3-nl-stalk" />
      <div className="vb3-nl-pin" />
    </div>
  );
}

// ── Hovedkomponent ──────────────────────────────────────────────────────────

function App() {
  const app = useFractionApp("B3");
  const {
    level, setLevelAndReset, A, B, nextPair,
    buildA, setBuildA, buildB, setBuildB, feedbackA, feedbackB, checkBuild,
    posA, setPosA, posB, setPosB, snapped, lineFeedback, checkLine,
    answer, answerFeedback, submitAnswer,
  } = app;

  return (
    <div className="vb3">
      <div className="vb3-wrap">
        <header className="vb3-head">
          <div className="vb3-bar">
            <div className="vb3-mark">
              <div className="vb3-mark-dot coral" />
              <div className="vb3-mark-dot steel" />
              <span>Brøkjamfører</span>
            </div>
            <div className="vb3-levels">
              {LEVELS.map(l => (
                <button key={l.id}
                  className={"vb3-lvl" + (level === l.id ? " on" : "")}
                  onClick={() => setLevelAndReset(l.id)}>
                  <span className="vb3-lvl-num">0{l.id}</span>
                  <span className="vb3-lvl-name">{l.name}</span>
                </button>
              ))}
            </div>
          </div>

          <h1 className="vb3-title">Hvilken brøk er størst?</h1>

          <div className="vb3-fracs">
            <FracBig letter="A" n={A[0]} d={A[1]} kind="coral" />
            <div className="vb3-vs"><span>vs</span></div>
            <FracBig letter="B" n={B[0]} d={B[1]} kind="steel" />
          </div>
        </header>

        <Block num="01" title="Bygg brøkene som sirkler" sub="Velg antall stykker. Klikk for å fargelegge.">
          <div className="vb3-circles">
            <CircleBuilder label="A" kind="coral" build={buildA} setBuild={setBuildA} feedback={feedbackA} onCheck={() => checkBuild("A")} />
            <CircleBuilder label="B" kind="steel" build={buildB} setBuild={setBuildB} feedback={feedbackB} onCheck={() => checkBuild("B")} />
          </div>
        </Block>

        <Block num="02" title="Plasser dem på tallinjen" sub="Dra A og B til der du tror de hører hjemme.">
          <NumberLine A={A} B={B} posA={posA} posB={posB} setPosA={setPosA} setPosB={setPosB} snapped={snapped} onCheck={checkLine} feedback={lineFeedback} />
        </Block>

        <Block num="03" title="Avgjør sammenligningen" sub="Velg ett alternativ.">
          <div className="vb3-choices">
            {[
              { id: "A", label: `${A[0]}/${A[1]}`, sub: "A er størst", kind: "coral" },
              { id: "eq", label: "=", sub: "Like store", kind: "neutral" },
              { id: "B", label: `${B[0]}/${B[1]}`, sub: "B er størst", kind: "steel" },
            ].map(c => (
              <button key={c.id}
                className={"vb3-choice " + c.kind + (answer === c.id ? " sel" : "")}
                disabled={answerFeedback?.kind === "ok"}
                onClick={() => submitAnswer(c.id)}>
                <span className="vb3-choice-big">{c.label}</span>
                <span className="vb3-choice-sub">{c.sub}</span>
              </button>
            ))}
          </div>
          {answerFeedback && (
            <div className={"vb3-fb vb3-fb-" + answerFeedback.kind}>
              <div className="vb3-fb-bar" />
              <div className="vb3-fb-text">{answerFeedback.text}</div>
            </div>
          )}
          {answerFeedback?.kind === "ok" && (
            <button className="vb3-btn vb3-btn-primary" onClick={nextPair}>Neste brøkpar →</button>
          )}
        </Block>

        <footer className="vb3-foot">
          <div>Denne siden samler ikke inn data om deg.</div>
          <div>CC BY-SA 4.0</div>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
